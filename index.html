<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Глаголы">
<meta name="theme-color" content="#f6f5f1">
<title>Английские глаголы</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a66;--ac:#2a6df4;--ok:#1b8a4b;--bad:#c93030;--bd:#e2e0d9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171717;--card:#222;--tx:#f2f2ef;--mut:#9b9a96;--ac:#6b9bff;--ok:#4cc27d;--bad:#ff7070;--bd:#333}}
:root[data-theme="dark"]{--bg:#171717;--card:#222;--tx:#f2f2ef;--mut:#9b9a96;--ac:#6b9bff;--ok:#4cc27d;--bad:#ff7070;--bd:#333}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:20px 16px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
h1{font-size:20px;margin:0 0 4px}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:15px;margin:18px 0 8px}
.sub{color:var(--mut);font-size:14px;margin-bottom:14px}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:28px 20px;margin-top:16px;text-align:center}
.ru{font-size:28px;font-weight:600;margin-bottom:20px;overflow-wrap:anywhere}
label{display:block;text-align:left;font-size:13px;color:var(--mut);margin:0 0 4px 4px}
.f{margin-bottom:10px}
.f[hidden]{display:none}
input{width:100%;font-size:20px;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);text-align:center}
input.good{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
input.wrong{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
button{width:100%;font-size:18px;padding:14px;margin-top:12px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--mut);font-size:14px;font-weight:400}
#menuBtn{width:44px;height:44px;margin:0;padding:0;flex:none;font-size:22px;line-height:1;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
#menuBtn[aria-expanded="true"]{background:var(--ac);color:#fff;border-color:var(--ac)}
.res{margin-top:8px;font-size:18px;min-height:52px;line-height:1.5}
.res .forms{font-size:20px;font-weight:600}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.panel{text-align:left;padding:20px}
.panel[hidden]{display:none}
.panel input{font-size:17px;padding:12px;text-align:left;margin-bottom:8px}
.hint{font-size:13px;color:var(--mut);margin:-2px 0 8px}
.msg{font-size:14px;min-height:18px;color:var(--mut)}
.panel ul{list-style:none;margin:0;padding:0;max-height:50vh;overflow-y:auto}
.panel li{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--bd);font-size:16px}
.panel li span{flex:1;overflow-wrap:anywhere}
.panel li small{color:var(--mut)}
.panel li button{width:auto;margin:0;padding:6px 12px;font-size:14px;background:transparent;color:var(--bad);border:1px solid var(--bd)}
.panel .empty{color:var(--mut);font-size:14px;padding:10px 0}
</style>
</head>
<body>
<main>
<div class="top">
<div><h1>Английские глаголы</h1><div class="sub" id="stat"></div></div>
<button id="menuBtn" aria-label="Меню слов" aria-expanded="false" aria-controls="panel">☰</button>
</div>
<div class="bar"><i id="bar"></i></div>

<div class="card panel" id="panel" hidden>
<h2>Добавить слово</h2>
<input id="newRu" autocomplete="off" placeholder="Слово по-русски">
<input id="new1" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="1 форма (go)">
<input id="new2" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="2 форма (went) — необязательно">
<input id="new3" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="3 форма (gone) — необязательно">
<div class="hint">Для обычного слова, не глагола, заполните только 1 форму. Если вариантов два, пишите через «/», например learnt/learned.</div>
<div class="msg" id="msg"></div>
<button id="add" style="margin-top:4px">Добавить</button>

<h3 id="listTitle">Все слова</h3>
<input id="search" type="search" autocomplete="off" placeholder="Поиск">
<ul id="list"></ul>
<button class="g" id="restore" hidden>Вернуть удалённые готовые слова</button>
</div>

<div class="card">
<div class="ru" id="ru"></div>
<div class="f"><label for="a0">1 форма (Infinitive)</label><input id="a0" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
<div class="f" id="f1"><label for="a1">2 форма (Past Simple)</label><input id="a1" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
<div class="f" id="f2"><label for="a2">3 форма (Past Participle)</label><input id="a2" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
<div class="res" id="res"></div>
<button class="g" id="spk" style="display:none;margin-top:0;font-size:16px">🔊 Прослушать</button>
<button id="btn">Проверить</button>
<button class="g" id="delCur">Удалить это слово</button>
</div>
<button class="g" id="reset">Начать заново</button>
</main>
<script>
/* [по-русски, 1 форма, 2 форма, 3 форма]; варианты через «/» */
var BASE=[
["быть","be","was/were","been"],
["бить","beat","beat","beaten"],
["становиться","become","became","become"],
["начинать","begin","began","begun"],
["гнуть","bend","bent","bent"],
["кусать","bite","bit","bitten"],
["дуть","blow","blew","blown"],
["ломать","break","broke","broken"],
["приносить","bring","brought","brought"],
["строить","build","built","built"],
["гореть, жечь","burn","burnt/burned","burnt/burned"],
["покупать","buy","bought","bought"],
["ловить","catch","caught","caught"],
["выбирать","choose","chose","chosen"],
["приходить","come","came","come"],
["стоить","cost","cost","cost"],
["резать","cut","cut","cut"],
["копать","dig","dug","dug"],
["делать","do","did","done"],
["рисовать","draw","drew","drawn"],
["мечтать, видеть сны","dream","dreamt/dreamed","dreamt/dreamed"],
["пить","drink","drank","drunk"],
["водить (машину)","drive","drove","driven"],
["есть, кушать","eat","ate","eaten"],
["падать","fall","fell","fallen"],
["кормить","feed","fed","fed"],
["чувствовать","feel","felt","felt"],
["драться, бороться","fight","fought","fought"],
["находить","find","found","found"],
["летать","fly","flew","flown"],
["забывать","forget","forgot","forgotten"],
["прощать","forgive","forgave","forgiven"],
["замерзать","freeze","froze","frozen"],
["получать","get","got","got/gotten"],
["давать","give","gave","given"],
["идти, ехать","go","went","gone"],
["расти","grow","grew","grown"],
["вешать, висеть","hang","hung","hung"],
["иметь","have","had","had"],
["слышать","hear","heard","heard"],
["прятать","hide","hid","hidden"],
["ударять","hit","hit","hit"],
["держать","hold","held","held"],
["причинять боль","hurt","hurt","hurt"],
["хранить, сохранять","keep","kept","kept"],
["знать","know","knew","known"],
["класть, накрывать (на стол)","lay","laid","laid"],
["вести, руководить","lead","led","led"],
["учить, узнавать","learn","learnt/learned","learnt/learned"],
["уходить, оставлять","leave","left","left"],
["одалживать (кому-то)","lend","lent","lent"],
["позволять","let","let","let"],
["лежать","lie","lay","lain"],
["зажигать","light","lit","lit"],
["терять","lose","lost","lost"],
["делать, изготавливать","make","made","made"],
["значить, иметь в виду","mean","meant","meant"],
["встречать","meet","met","met"],
["платить","pay","paid","paid"],
["класть, ставить","put","put","put"],
["читать","read","read","read"],
["ездить (верхом, на велосипеде)","ride","rode","ridden"],
["звонить","ring","rang","rung"],
["подниматься","rise","rose","risen"],
["бежать","run","ran","run"],
["сказать","say","said","said"],
["видеть","see","saw","seen"],
["продавать","sell","sold","sold"],
["отправлять","send","sent","sent"],
["устанавливать","set","set","set"],
["трясти","shake","shook","shaken"],
["светить, сиять","shine","shone","shone"],
["стрелять","shoot","shot","shot"],
["показывать","show","showed","shown"],
["закрывать","shut","shut","shut"],
["петь","sing","sang","sung"],
["тонуть","sink","sank","sunk"],
["сидеть","sit","sat","sat"],
["спать","sleep","slept","slept"],
["говорить (на языке)","speak","spoke","spoken"],
["тратить","spend","spent","spent"],
["стоять","stand","stood","stood"],
["красть","steal","stole","stolen"],
["приклеивать","stick","stuck","stuck"],
["плавать","swim","swam","swum"],
["брать","take","took","taken"],
["обучать, преподавать","teach","taught","taught"],
["рвать","tear","tore","torn"],
["рассказывать","tell","told","told"],
["думать","think","thought","thought"],
["бросать","throw","threw","thrown"],
["понимать","understand","understood","understood"],
["просыпаться, будить","wake","woke","woken"],
["носить (одежду)","wear","wore","worn"],
["выигрывать","win","won","won"],
["писать","write","wrote","written"]
];
var LVL_KEY="verbs_lvl_v1",OWN_KEY="verbs_own_v1",HID_KEY="verbs_hidden_v1";
var own=[],hidden=[],lv={},W=[],cur=-1,curKey=null,checked=false;

function load(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function $(id){return document.getElementById(id)}
function norm(t){return t.toLowerCase().trim().replace(/\s+/g," ").replace(/ise\b/g,"ize")}
function key(p){return p[0]+"|"+p[1]}
function forms(p){return p.slice(1).filter(function(x){return x})}
function isWord(p){return Array.isArray(p)&&p.length>=2&&p.every(function(x){return typeof x==="string"})&&p[0]&&p[1]}
/* ответ верный, если совпал с любым вариантом или со всей записью */
function match(input,answer){
  var a=norm(input).replace(/\s*[\/,]\s*/g,"/");
  if(!a)return false;
  var full=norm(answer).replace(/\s*\/\s*/g,"/");
  return a===full||full.split("/").indexOf(a)>=0;
}

var o=load(OWN_KEY);if(Array.isArray(o))own=o.filter(isWord);
var h=load(HID_KEY);if(Array.isArray(h))hidden=h.filter(function(x){return typeof x==="string"});
var l=load(LVL_KEY);if(l&&typeof l==="object"&&!Array.isArray(l))lv=l;
function build(){W=BASE.filter(function(p){return hidden.indexOf(key(p))<0}).concat(own)}
function lev(i){return lv[key(W[i])]||0}
function save(){store(LVL_KEY,lv);store(OWN_KEY,own);store(HID_KEY,hidden)}
function findCur(){cur=W.findIndex(function(x){return key(x)===curKey})}
build();

/* тренировка */
function pick(){
  var pool=[];
  W.forEach(function(p,i){var x=lev(i);if(i!==cur&&x<3){for(var k=0;k<4-x;k++)pool.push(i)}});
  if(!pool.length)return -1;
  return pool[Math.floor(Math.random()*pool.length)];
}
function stat(){
  var d=0;W.forEach(function(p,i){if(lev(i)>=3)d++});
  $("stat").textContent="Выучено: "+d+" из "+W.length;
  $("bar").style.width=(W.length?d/W.length*100:0)+"%";
}
function inputs(){return [$("a0"),$("a1"),$("a2")]}
function next(){
  var n=pick(),ru=$("ru"),res=$("res"),btn=$("btn");
  stat();checked=false;res.textContent="";$("spk").style.display="none";
  inputs().forEach(function(x){x.value="";x.className="";x.readOnly=false});
  if(n<0){
    if(cur>=0&&cur<W.length&&lev(cur)<3){n=cur}
    else{
      cur=-1;curKey=null;
      ru.textContent=W.length?"Все слова выучены!":"Нет слов. Добавьте их через меню ☰";
      $("a0").parentNode.hidden=true;$("f1").hidden=true;$("f2").hidden=true;
      btn.style.display="none";$("delCur").style.display="none";return;
    }
  }
  cur=n;curKey=key(W[cur]);
  var p=W[cur];
  ru.textContent=p[0];
  $("a0").parentNode.hidden=false;
  $("f1").hidden=!p[2];$("f2").hidden=!p[3];
  btn.style.display="";$("delCur").style.display="";btn.textContent="Проверить";
  if($("panel").hidden)$("a0").focus();
}
function act(){
  if(checked){next();return}
  if(cur<0)return;
  var p=W[cur],k=key(p),ins=inputs(),all=true,res=$("res");
  for(var i=0;i<3;i++){
    if(!p[i+1])continue;
    var ok=match(ins[i].value,p[i+1]);
    ins[i].className=ok?"good":"wrong";ins[i].readOnly=true;
    if(!ok)all=false;
  }
  res.textContent="";
  var head=document.createElement("div");
  if(all){lv[k]=Math.min(3,(lv[k]||0)+1);head.className="ok";head.textContent="Верно!"}
  else{delete lv[k];head.className="bad";head.textContent="Правильно:"}
  res.appendChild(head);
  if(!all||forms(p).length>1){
    var f=document.createElement("div");f.className="forms";
    f.textContent=forms(p).join(" — ");res.appendChild(f);
  }
  save();stat();checked=true;$("btn").textContent="Дальше";$("spk").style.display="";
  say(p);$("btn").focus();
}
function say(p){try{var u=new SpeechSynthesisUtterance(forms(p).map(function(x){return x.replace(/\//g," or ")}).join(", "));u.lang="en-US";u.rate=0.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

/* меню: добавить / удалить */
function renderList(){
  var ul=$("list"),q=$("search").value.trim().toLowerCase();ul.textContent="";
  $("listTitle").textContent="Все слова ("+W.length+")";
  var shown=0;
  W.forEach(function(p,i){
    if(q&&p.join(" ").toLowerCase().indexOf(q)<0)return;
    shown++;
    var li=document.createElement("li"),sp=document.createElement("span"),sm=document.createElement("small"),del=document.createElement("button");
    sp.textContent=p[0]+" — "+forms(p).join(" · ")+" ";
    sm.textContent=(own.some(function(x){return key(x)===key(p)})?"моё ":"")+(lev(i)>=3?"✓":"");
    sp.appendChild(sm);
    del.textContent="Удалить";
    del.onclick=function(){removeWord(i)};
    li.appendChild(sp);li.appendChild(del);ul.appendChild(li);
  });
  if(!shown){var e=document.createElement("li");e.className="empty";e.textContent=q?"Ничего не найдено":"Слов нет";ul.appendChild(e)}
  var r=$("restore");r.hidden=!hidden.length;r.textContent="Вернуть удалённые готовые слова ("+hidden.length+")";
}
function addWord(){
  var ru=$("newRu").value.trim(),v1=$("new1").value.trim(),v2=$("new2").value.trim(),v3=$("new3").value.trim(),msg=$("msg");
  if(!ru||!v1){msg.textContent="Заполните слово по-русски и 1 форму.";return}
  if(v3&&!v2){msg.textContent="Заполните 2 форму или оставьте 3 форму пустой.";return}
  var p=[ru,v1];if(v2)p.push(v2);if(v3)p.push(v3);
  var k=key(p);
  if(W.some(function(x){return key(x).toLowerCase()===k.toLowerCase()})){msg.textContent="Такое слово уже есть.";return}
  var hi=hidden.indexOf(k);
  if(hi>=0)hidden.splice(hi,1);else own.push(p);
  build();save();
  ["newRu","new1","new2","new3"].forEach(function(id){$(id).value=""});
  msg.textContent="Добавлено: "+ru+" — "+forms(p).join(" · ");
  renderList();
  if(cur<0&&!checked)next();else{findCur();stat()}
  $("newRu").focus();
}
function removeWord(i){
  var p=W[i],k=key(p);
  if(!confirm("Удалить «"+p[0]+" — "+forms(p).join(" · ")+"»?"))return;
  var wasCur=(k===curKey);
  var oi=own.findIndex(function(x){return key(x)===k});
  if(oi>=0)own.splice(oi,1);else hidden.push(k);
  delete lv[k];
  build();save();
  $("msg").textContent="Удалено: "+p[0];
  if(wasCur){cur=-1;next()}else{findCur();stat()}
  renderList();
}
$("restore").onclick=function(){
  if(!confirm("Вернуть "+hidden.length+" удалённых готовых слов?"))return;
  hidden=[];build();save();findCur();
  $("msg").textContent="Готовые слова возвращены.";
  renderList();if(cur<0)next();else stat();
};
$("menuBtn").onclick=function(){
  var p=$("panel"),open=p.hidden;
  p.hidden=!open;this.setAttribute("aria-expanded",open?"true":"false");
  if(open){$("msg").textContent="";renderList();$("newRu").focus()}
};

/* Enter: к следующему полю, на последнем — проверить */
inputs().forEach(function(x,i){
  x.onkeydown=function(e){
    if(e.key!=="Enter")return;
    e.preventDefault();
    if(checked){next();return}
    var ins=inputs();
    for(var j=i+1;j<3;j++){if(!ins[j].parentNode.hidden){ins[j].focus();return}}
    act();
  };
});
$("spk").onclick=function(){if(cur>=0)say(W[cur])};
$("btn").onclick=act;
$("delCur").onclick=function(){if(cur>=0)removeWord(cur)};
$("add").onclick=addWord;
$("search").oninput=renderList;
["newRu","new1","new2"].forEach(function(id,i,arr){$(id).onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();$(["new1","new2","new3"][i]).focus()}}});
$("new3").onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();addWord()}};
$("reset").onclick=function(){lv={};save();cur=-1;if(!$("panel").hidden)renderList();next()};
next();
</script>
</body>
</html>
